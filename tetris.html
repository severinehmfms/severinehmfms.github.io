<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tetris.css">
</head>

<body>

    <div class="conteneur-jeu">

        <aside class="panneau">
            <h1>🎮 TETRIS</h1>

            <button id="bouton-pause" class="bouton-jeu">
                <span aria-hidden="true">Ⅱ</span> Pause
            </button>

            <button id="bouton-reprendre" class="bouton-jeu" hidden>
                <span aria-hidden="true">▶</span> Reprendre
            </button>

            <div class="score-box">
                <p> SCORE </p>
                <span id="score">0</span>
            </div>

            <div class="vitesse-box">
                <p>VITESSE</p>
                <span id="vitesse">Niveau 1</span>
                <div class="barre-vitesse">
                    <div id="progression-vitesse"></div>
                </div>
            </div>

            <p class="aide">← → Déplacer</p>
            <p class="aide">↑ Tourner</p>
            <p class="aide">↓ Accélérer</p>
        </aside>

        <div class="zone-jeu">
            <canvas id="jeu" width="300" height="600"></canvas>
            
            <div class="commandes">

                <!-- Rotation, séparée des autres commandes -->
                <button type="button" class="bouton-direction bouton-rotation"
                        data-touche="ArrowUp" aria-label="Tourner la pièce">
                    ↻
                </button>

                <!-- Déplacements -->
                <button type="button" class="bouton-direction"
                        data-touche="ArrowLeft" aria-label="Déplacer à gauche">
                    ←
                </button>

                <button type="button" class="bouton-direction bouton-descente"
                        data-touche="ArrowDown" aria-label="Accélérer la descente">
                    ↓
                </button>

                <button type="button" class="bouton-direction"
                        data-touche="ArrowRight" aria-label="Déplacer à droite">
                    →
                </button>

            </div>

        </div>

    </div>

    <script src="js/tetris.js"></script>

</body>

</html>
