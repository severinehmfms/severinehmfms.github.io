<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake</title>

    <link rel="stylesheet" href="css/snake.css">
</head>

<body>

    <h1>🐍 Sève's snake 😊 </h1>

    <p>
        Score : <span id="score">0</span>
    </p>

    <canvas id="game" width="400" height="400"></canvas>

    <!-- Boutons de direction -->
    <div id="controls">
        <button class="arrow" id="up" aria-label="Haut">▲</button>

        <div class="horizontal-controls">
            <button class="arrow" id="left" aria-label="Gauche">◀</button>
            <button class="arrow" id="down" aria-label="Bas">▼</button>
            <button class="arrow" id="right" aria-label="Droite">▶</button>
        </div>
    </div>

    <button id="restart">Recommencer</button>

    <script src="js/snake.js"></script>

</body>

</html>
